# ============================================================
#  TOP4EA C++20 — Fichier de configuration
#  Compatible MetaTrader 4 ET MetaTrader 5 via MetaApi REST
# ============================================================

# ─── Plateforme MetaTrader ───────────────────────────────────
# auto : détecté automatiquement depuis l'info compte MetaApi
#          → recommandé, s'adapte selon le type de compte
# mt4  : forcer MT4 (slippage ticks, pas de fillingMode)
# mt5  : forcer MT5 (deviation points, fillingMode FOK, POSITION_MODIFY)
#
# DIFFÉRENCES MT4 / MT5 gérées automatiquement :
#   [1] Ordres marché : slippage (MT4) → deviation (MT5)
#   [2] Ordres marché : fillingMode = ORDER_FILLING_FOK ajouté pour MT5
#   [3] Modification SL/TP position : ORDER_MODIFY (MT4) → POSITION_MODIFY (MT5)
#   [4] Commentaire : tronqué à 31 caractères pour MT5
platform         = auto

# ─── Symbole & lots ─────────────────────────────────────────
symbol           = XAUUSDm
base_lot         = 0.10

# ─── Multiplicateur de lots recovery ────────────────────────
# Plage de multiplicateur appliquée selon la profondeur de recovery
#   lot_multiplier     = multiplicateur au niveau 1 (entrée de range)
#   lot_multiplier_max = multiplicateur au niveau maxRecovery (sortie de range)
#
# Exemples pour base_lot=0.10, max_recovery=5 :
#   L0 :  0.10 (entrée initiale — aucun multiplicateur)
#   L1 :  0.10 × 1.15 = 0.12
#   L2 :  0.12 × 1.27 = 0.15
#   L3 :  0.15 × 1.38 = 0.21
#   L4 :  0.21 × 1.50 = 0.31
#   L5 :  0.31 × 1.62 = 0.50
#
# Pour activer : mettre use_fixed_lot_schedule = false
# Pour désactiver le gradient (multiplier fixe) : lot_multiplier_max = lot_multiplier
lot_multiplier     = 1.15
lot_multiplier_max = 1.66

# digits — Précision prix (décimales du broker)
#   0  = AUTO-DÉTECTION pure — le moteur interroge le broker au démarrage
#   2  = XAUUSDm 2 décimales — RECOMMANDÉ (safe fallback si broker offline)
#          point = 0.01  →  grid_gap 500 pts = $5.00  ← correct pour XAU
#          L'auto-détection broker viendra confirmer/remplacer si digits=broker
#   3  = Exness XAUUSDm 3 décimales → grid_gap 500 pts = $0.50
#   5  = EURUSD/paires forex — NE PAS utiliser pour XAU (gridGap = $0.005 !)
digits           = 2

# ─── Grille ─────────────────────────────────────────────────
# Distances en pips (1 pip = 0.01 sur XAUUSDm digits=2)
# halfGap = grid_gap / 2 = 1200 pips de distance SS/BS par rapport au prix
# Recovery spacing : 1200 pips entre chaque niveau
#   L1 -1200p | L2 -2400p | L3 -3600p | L4 -4800p ≈ -5000p
grid_gap         = 2400
use_atr_grid     = true
atr_period       = 14
atr_mult         = 2.0
atr_grid_min     = 1200
atr_grid_max     = 4000

# ─── Targets ─────────────────────────────────────────────────
basket_target    = 10.0
# basket_max_loss : seuil de perte d'urgence en état MaxRecoveryHold (valeur négative)
# Si le panier atteint ce seuil après épuisement de la Martingale,
# tout est fermé au marché pour limiter le drawdown. 0 = désactivé (attendre indéfiniment).
# Exemple : -300 = sortie forcée si le panier perd plus de $300 en mode hold.
basket_max_loss  = -300.0
daily_target_pct = 0.0
use_vabt         = true
vabt_coeff       = 0.40

# ─── Recovery ────────────────────────────────────────────────
max_recovery     = 5
kelly_max        = 0.25

# ─── Schedule de lots fixe (grille recovery XAUUSDm) ─────────
# true  → L1=0.10 L2=0.10(hedge) L3=0.20 L4=0.30 L5=0.40
# false → géométrique baseLot × lot_multiplier^n (Kelly-cappé)
use_fixed_lot_schedule = true

# ─── TP par vagues ───────────────────────────────────────────
# Fermeture progressive pour capturer le profit sans tout-ou-rien
#   Wave 1 : P&L ≥ wave1_target → ferme ~50% des positions
#   Wave 2 : P&L ≥ wave2_target → ferme ~30% du restant
#   Wave 3 : trailing 400 pips sur le reliquat (~20%)
wave_enabled     = true
wave1_target     = 5.00
wave2_target     = 10.00

# ─── Garde Cascade Professionnel ────────────────────────────
# [1] Déplacement de prix minimum depuis le dernier déclenchement
#
#     DEUX MODES (le mode pips est prioritaire si > 0) :
#
#     Mode pips fixe (RECOMMANDÉ) :
#       cascade_price_dispatch_pips = 120
#       → 120 pips = 1200 points (XAUUSDm digits=2 : 1 pip = 10 points)
#       → Indépendant du GridGap, cohérent et prévisible
#
#       ⚠ IMPORTANT : ce paramètre est le SPACING ENTRE RECOVERIES,
#       pas la distance trail (trail_fixed_dist_pts = 600 pts = 60 pips).
#       Ces deux valeurs DOIVENT être différentes :
#         trail_fixed_dist_pts  = 600 pts (60 pips) → séparation trail
#         cascade_dispatch_pips = 200 pips           → protection recovery
#
#       Plage recommandée pour XAUUSDm :
#         80  pips = 800  pts → marché calme
#         120 pips = 1200 pts → standard (défaut)
#         200 pips = 2000 pts → très conservateur
#
#     Mode % GridGap (fallback si pips = 0) :
#       cascade_price_dispatch_pct = 0.50
#       → 50% du GridGap (ex: 2400 × 0.50 = 1200 pts → trop large)
#
cascade_price_dispatch_pips = 200
cascade_price_dispatch_pct  = 0.50

# [2] Spread maximum autorisé (multiple du spread moyen EWMA)
#     Ex: 2.5 = bloqué si spread > 2.5× spread habituel (news/spike)
cascade_spread_max_mult    = 2.5

# [3] Anti-whipsaw : le prix doit tenir son côté après le déclenchement
#     (automatique — pas de paramètre à régler)

# Lissage EWMA pour le spread de référence (plus petit = plus lent = plus stable)
cascade_spread_ewma_alpha  = 0.05

# ─── Fermeture prédictive (vélocité P&L) ────────────────────
use_pnl_velocity = true
velocity_alpha   = 0.30
velocity_trigger = 0.85

# ─── Trail Stop Adaptatif — 4 axes ──────────────────────────
# [1] Step Trail : seuil minimum de déplacement avant de modifier un stop
#     Exprimé en % du GridGap courant
#     0.15 = le stop ne bouge que si le prix s'est déplacé de 15% du gap
#     Effet : -80% de OrderModify inutiles, stops plus stables
trail_step_pct          = 0.15

# [2] Gel zone TP : figer les stops quand le basket profit atteint ce % du target
#     0.60 = stops figés quand P&L ≥ 60% du target
#     Effet : protège les cycles gagnants en fin de parcours
trail_freeze_zone       = 0.60

# [3] Gap expansion par niveau de recovery
#     Chaque niveau de recovery élargit le gap de ce % supplémentaire
#     0.05 = au recovery 10 → gap × 1.50 (+50%), au recovery 5 → gap × 1.25
#     Effet : évite la cascade rapide sur les mêmes niveaux de prix
gap_expansion_factor    = 0.05

# [4] Trail asymétrique : facteur côté lourd vs côté léger
#     Le côté avec plus de recovery est éloigné (conservateur)
#     Le côté avec moins de recovery est rapproché (réactif)
#     0.15 = côté lourd gap×1.15, côté léger gap×0.85
trail_asymmetry_factor  = 0.15

# [5] Trail fixe en points (0 = désactivé → utilise le demi-GridGap adaptatif)
#     Quand > 0 : SS et BS placés à exactement cette distance du prix courant.
#
#     CALCUL PIPS → POINTS selon le symbole :
#     XAUUSDm 2 décimales (digits=2) : 1 pip = 10 points
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#     XAUUSDm 3 décimales (digits=3) : 1 pip = 10 points aussi
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#     Forex EURUSD 5 décimales       : 1 pip = 10 points
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#
#     IMPORTANT : Le broker impose un STOPLEVEL minimum (~100 pts pour XAU)
#     Si trail_fixed_dist_pts < minDist broker, c'est auto-ajusté au minimum.
#
#     0 = mode adaptatif (demi-GridGap × facteur intelligence)
#   100 = trail fixe 10 pips (valeur recommandée pour XAUUSDm)
trail_fixed_dist_pts    = 600

# [6] Seuil de déplacement minimum avant recalcul du trail (en points)
#     0         = quasi-continu (trail se recalcule à chaque tick, 1 pt mini)
#     25        = trail recalculé seulement si prix bouge de 25 pts (2.5 pips)
#     Recommandé avec trail_fixed_dist_pts > 0 : mettre à 0 ou 1
#     (en mode adaptatif, ce champ est ignoré et le seuil = demi-gap/10)
trail_min_change_pts    = 5

# ─── Trading ─────────────────────────────────────────────────
magic            = 10300
slippage         = 3
spread_avg_alpha = 0.10

# ─── Connexion MetaApi ───────────────────────────────────────
# Les credentials sont lus depuis les variables d'environnement :
#   METAAPI_TOKEN      : token d'authentification MetaApi
#   METAAPI_ACCOUNT_ID : identifiant du compte MT4 ou MT5 sur MetaApi
#   METAAPI_REGION     : région MetaApi (défaut : new-york)
#
# La plateforme (mt4/mt5) est détectée automatiquement depuis
# l'endpoint accountInformation si platform = auto (recommandé).
#
# Fréquences de polling
tick_poll_ms     = 100
state_poll_ms    = 2000
reconnect_ms     = 1000

# ─── Verrouillage Profit Trailing (V-BS / V-SS) ─────────────
# Ordres stops trailing qui verrouillent le profit progressivement
# au fur et à mesure que le prix avance dans le sens favorable.
#
# V-SS (Sell Stop Trailing, côté BUY) :
#   S'active quand bid > avgBuyEntry + vl_activation_pts
#   Niveau = bid - vl_trail_pts (trail en dessous du bid)
#   Ratchet UP strict : monte avec le bid, ne descend JAMAIS
#   Déclenchement (bid ≤ niveau) → toutes les Buy fermées = profit verrouillé
#
# V-BS (Buy Stop Trailing, côté SELL) :
#   S'active quand ask < avgSellEntry - vl_activation_pts
#   Niveau = ask + vl_trail_pts (trail au-dessus de l'ask)
#   Ratchet DOWN strict : descend avec l'ask, ne remonte JAMAIS
#   Déclenchement (ask ≥ niveau) → toutes les Sell fermées = profit verrouillé
#
# vl_activation_pts : profit minimum en points avant activation du trailing
#   XAUUSDm digits=2 : 50 pts = 5 pips = ~$0.50/lot de profit minimum
#   Recommandé : 30-100 pts selon volatilité et target
#
# vl_trail_pts : distance trailing en points
#   XAUUSDm digits=2 : 30 pts = 3 pips de trailing
#   Plus petit = verrouillage plus serré (risque de faux déclenchement)
#   Plus grand = plus de marge mais moins de profit verrouillé
#   Recommandé : 20-50 pts selon l'ATR et les préférences
vl_enabled          = true
# vl_activation_pts : CORRECTION BUG CRITIQUE
#   Ancienne valeur : 50 pts = $0.50 en prix → VL déclenchait sur du bruit ($0.05 de profit)
#   Nouvelle valeur : 2400 pts = 1 GridGap complet → le côté doit d'abord gagner ≥ 1 gap
#   Effet : VL ne s'active que quand le côté gagnant a réellement progressé d'un gap entier
#   Profit minimum avant activation (1.10 lots) : 2400 × 1.10 × 0.10 = $264 potentiel
vl_activation_pts   = 2400

# vl_trail_pts : CORRECTION BUG CRITIQUE
#   Ancienne valeur : 30 pts = $0.30 → tout spread widening déclenchait la fermeture
#   Nouvelle valeur : 600 pts = 25% du GridGap → trail significatif et robuste au bruit
#   À cette distance, un retournement de 600 pts ($6.00) est nécessaire pour fermer le côté
vl_trail_pts        = 600

# ─── Dual Trail NATURAL / AGGRESSIVE avec verrouillage profit ────
# Quand trail_mode_auto = true, le moteur surveille le profit flottant
# des positions Sell et bascule automatiquement en mode AGGRESSIVE
# quand le profit dépasse x_lock_pips.
#
# NATURAL  : trail fixe symétrique — distances natural_ss_dist_pts / natural_bs_dist_pts
#            Remplace trail_fixed_dist_pts pour permettre l'asymétrie SS ≠ BS
#
# AGGRESSIVE : le BuyStop glisse progressivement vers le niveau de verrou
#   Niveau verrou (V-BS) = ss_entry + bs_overshoot_pips pts AU-DESSUS du point d'entrée
#   Glissement = aggressive_step_pts pts par tick (descendant)
#   Une fois le verrou atteint : affiche [LOCK] et garantit profit minimum
#
# Transition AGGRESSIVE→NATURAL : si le profit SS retombe sous x_lock_pips,
#   le BS retourne en mode NATURAL automatiquement (cycle réinitialisé).
#
# false = mode dual trail désactivé (comportement 100% identique à avant)
# true  = activation automatique selon profit SS flottant
trail_mode_auto         = false

# x_lock_pips : seuil de profit SS (en points) déclenchant le mode AGGRESSIVE
#   XAUUSDm digits=2 : 500 pts = 50 pips = déplacement favorable de 50 pips
#   Recommandé : 1 GridGap complet (= grid_gap = 500 pts par défaut)
x_lock_pips             = 500

# bs_overshoot_pips : dépassement au-dessus du prix d'entrée SS pour le verrou
#   V-BS lock level = ss_entry + bs_overshoot_pips * point
#   Ex: ss_entry=1900.00, bs_overshoot_pips=500 → verrou @ 1900.00 + 5.00 = 1905.00
#   Cette valeur garantit un profit minimum de bs_overshoot_pips pts sur la position Sell
bs_overshoot_pips       = 500

# aggressive_step_pts : vitesse de glissement du BS par tick en mode AGGRESSIVE
#   Le BS descend de ce nombre de points à chaque tick vers le niveau verrou
#   200 pts/tick = glissement progressif sur ~5-10 ticks typiquement
aggressive_step_pts     = 200

# natural_bs_dist_pts : distance BS en mode NATURAL (quand trailModeAuto=true)
#   Remplace trail_fixed_dist_pts pour le BS uniquement → permet asymétrie BS ≠ SS
#   0 = utilise trail_fixed_dist_pts (comportement identique symétrique)
natural_bs_dist_pts     = 600

# natural_ss_dist_pts : distance SS en mode NATURAL (quand trailModeAuto=true)
#   Remplace trail_fixed_dist_pts pour la SS uniquement → permet asymétrie SS ≠ BS
#   0 = utilise trail_fixed_dist_pts (comportement identique symétrique)
natural_ss_dist_pts     = 600
