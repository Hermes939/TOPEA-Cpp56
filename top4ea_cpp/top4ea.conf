# ============================================================
#  TOP4EA C++20 — Fichier de configuration
#  Compatible MetaTrader 4 ET MetaTrader 5 via MetaApi REST
# ============================================================
#
# ─── SURCHARGE PAR VARIABLES D'ENVIRONNEMENT (env-first) ────
#
# Tout paramètre peut être surchargé sans modifier ce fichier
# via une variable d'environnement Replit du format :
#   TOP4EA_<NOM_MAJUSCULE_AVEC_UNDERSCORES>
#
# Correspondances principales :
#   platform               → TOP4EA_PLATFORM
#   symbol                 → TOP4EA_SYMBOL
#   base_lot               → TOP4EA_BASE_LOT
#   lot_multiplier         → TOP4EA_LOT_MULTIPLIER
#   lot_multiplier_max     → TOP4EA_LOT_MULTIPLIER_MAX
#   grid_gap               → TOP4EA_GRID_GAP
#   basket_target          → TOP4EA_BASKET_TARGET
#   basket_max_loss        → TOP4EA_BASKET_MAX_LOSS
#   max_recovery           → TOP4EA_MAX_RECOVERY
#   max_recovery_active    → TOP4EA_MAX_RECOVERY_ACTIVE
#   max_lots               → TOP4EA_MAX_LOTS
#   magic                  → TOP4EA_MAGIC
#   slippage               → TOP4EA_SLIPPAGE
#   digits                 → TOP4EA_DIGITS
#   use_atr_grid           → TOP4EA_USE_ATR_GRID
#   atr_mult               → TOP4EA_ATR_MULT
#   atr_grid_min           → TOP4EA_ATR_GRID_MIN
#   atr_grid_max           → TOP4EA_ATR_GRID_MAX
#   trail_fixed_dist_pts   → TOP4EA_TRAIL_FIXED_DIST_PTS
#   trail_mode_auto        → TOP4EA_TRAIL_MODE_AUTO
#   x_lock_pips            → TOP4EA_X_LOCK_PIPS
#   bs_overshoot_pips      → TOP4EA_BS_OVERSHOOT_PIPS
#   vl_enabled             → TOP4EA_VL_ENABLED
#   vl_activation_pts      → TOP4EA_VL_ACTIVATION_PTS
#   vl_trail_pts           → TOP4EA_VL_TRAIL_PTS
#   use_pnl_velocity       → TOP4EA_USE_PNL_VELOCITY
#   use_vabt               → TOP4EA_USE_VABT
#   vabt_coeff             → TOP4EA_VABT_COEFF
#   use_fixed_lot_schedule → TOP4EA_USE_FIXED_LOT_SCHEDULE
#   wave_enabled           → TOP4EA_WAVE_ENABLED
#   wave1_target           → TOP4EA_WAVE1_TARGET
#   wave2_target           → TOP4EA_WAVE2_TARGET
#   tick_poll_ms           → TOP4EA_TICK_POLL_MS
#   state_poll_ms          → TOP4EA_STATE_POLL_MS
#   ds_stale_hard_sec      → TOP4EA_DS_STALE_HARD_SEC
#   vote_ss_only_threshold → TOP4EA_VOTE_SS_ONLY_THRESHOLD
#   vote_bs_only_threshold → TOP4EA_VOTE_BS_ONLY_THRESHOLD
#   ds_hard_gate_pct       → TOP4EA_DS_HARD_GATE_PCT
#
# Exemple : TOP4EA_GRID_GAP=240 surcharge grid_gap ci-dessous.
# Les surcharges actives sont loguées au démarrage :
#   [CONFIG] grid_gap=240 (env override)
# Le fichier .conf reste la documentation et la valeur par défaut.
# ─────────────────────────────────────────────────────────────

# ─── Plateforme MetaTrader ───────────────────────────────────
# auto : détecté automatiquement depuis l'info compte MetaApi
#          → recommandé, s'adapte selon le type de compte
# mt4  : forcer MT4 (slippage ticks, pas de fillingMode)
# mt5  : forcer MT5 (deviation points, fillingMode FOK, POSITION_MODIFY)
#
# DIFFÉRENCES MT4 / MT5 gérées automatiquement :
#   [1] Ordres marché : slippage (MT4) → deviation (MT5)
#   [2] Ordres marché : fillingMode = ORDER_FILLING_FOK ajouté pour MT5
#   [3] Modification SL/TP position : ORDER_MODIFY (MT4) → POSITION_MODIFY (MT5)
#   [4] Commentaire : tronqué à 31 caractères pour MT5
platform         = auto

# ─── Symbole & lots ─────────────────────────────────────────
symbol           = XAUUSDc
base_lot         = 0.01

# ─── Multiplicateur de lots recovery ────────────────────────
# Plage de multiplicateur appliquée selon la profondeur de recovery
#   lot_multiplier     = multiplicateur au niveau 1 (entrée de range)
#   lot_multiplier_max = multiplicateur au niveau maxRecovery (sortie de range)
#
# Exemples pour base_lot=0.01, max_recovery=5 :
#   L0 :  0.001 (entrée initiale — aucun multiplicateur)
#   L1 :  0.001 × 2.0 = 0.002
#   L2 :  0.002 × 2.0 = 0.004
#   L3 :  0.004 × 2.0 = 0.008
#   L4 :  0.008 × 2.0 = 0.016
#   L5 :  0.016 × 2.0 = 0.032
#
# Pour activer : mettre use_fixed_lot_schedule = false
# Pour désactiver le gradient (multiplier fixe) : lot_multiplier_max = lot_multiplier
lot_multiplier     = 2.0
lot_multiplier_max = 2.0

# digits — Précision prix (décimales du broker)
#   0  = AUTO-DÉTECTION pure (DÉFAUT) — le moteur interroge le broker au démarrage.
#          Aucun rescale ne sera appliqué : les valeurs de grille ci-dessous sont
#          exprimées nativement pour digits=3 (Exness XAUUSDm, point=0.001).
#          Si le broker répond offline au démarrage, digits=3 est supposé implicitement.
#   3  = Exness XAUUSDm 3 décimales — forcer (surcharge manuelle)
#   2  = XAUUSDmicro 2 décimales — forcer (surcharge manuelle, ATTENTION : rescale ×10 !)
#   5  = EURUSD/paires forex — NE PAS utiliser pour XAU
#
# ⚠ IMPORTANT : laisser digits=0 pour Exness XAUUSDm 3-décimales.
#   Mettre digits=2 déclencherait un rescale ×10 parasite (gridGap 2400→24000 pts).
digits           = 0

# ─── Grille ─────────────────────────────────────────────────
# Distances en POINTS broker-natif (Exness XAUUSDc 3 décimales : 1 point = 0.001)
# halfGap = grid_gap / 2 = 1200 points de distance SS/BS par rapport au prix
# Recovery spacing : 1200 points entre chaque niveau
#   L1 -1200p | L2 -2400p | L3 -3600p | L4 -4800p ≈ -5000p
# En $ : 1 point = $0.10/lot → halfGap 1200 pts = $12/lot (base_lot=0.10 → $1.20)
grid_gap         = 240
use_atr_grid     = false
atr_period       = 14
atr_mult         = 2.0
atr_grid_min     = 120
atr_grid_max     = 400

# ─── Targets ─────────────────────────────────────────────────
# basket_target :
#   0   = MODE DYNAMIQUE PAR LOTS (recommandé, défaut)
#         Formule : target = totalLots × $70/lot × bonus × (1 + vélocité×30%)
#         Paliers bonus : ×1.00 si lots<2 | ×1.10 si lots≥2 | ×1.265 si lots≥5
#         Exemples : 0.10L → $1.50 | 1.00L → $7.00 | 2.00L → $15.40 | 5.00L → $44.27
#         Composante vélocité : +0% à +30% selon la pente EWMA du P&L
#   >0  = Valeur fixe en $ (ex: 10.0 → target fixe $10)
#         Si use_vabt=true : formule VABT (ATR×coeff×lots) utilisée à la place
#
# ── Calibration (Task #18 — backtest data/automl_training.csv, 250 cycles) ──
#   Valeurs d'origine (150 $/lot, bonus ×1.25/×1.5625) recalibrées après
#   backtest contre le P&L réel par cycle (lot_used/pnl_result du CSV) :
#   le bonus ×1.5625 sur les gros paniers (≥5L) dépassait largement la
#   rentabilité $/lot réellement observée (médiane négative sur cette
#   tranche à cause de la variance des recoveries profondes), faisant
#   chuter le taux d'atteinte du target à 29-33% sur les paniers 2-5L/5L+.
#   Après recalibration (150→70 $/lot, bonus 1.25→1.10 à 2L, 1.25→1.15 à
#   5L) : taux d'atteinte global 41.2%→44.8%, tranche 2-5L 33%→57%,
#   tranche 5L+ 29%→36%, sans dégrader les petits paniers (déjà dominés
#   par le plancher $1.50). Comparé à l'ancien target fixe $10 (taux
#   d'atteinte 38% toutes tranches confondues), la formule dynamique
#   recalibrée reste supérieure et beaucoup plus accessible sur les
#   paniers à fort recovery. La composante vélocité (0.30) n'a pas pu
#   être recalibrée faute de série $/tick par cycle dans le CSV — voir
#   top4ea_engine.cpp::effectiveTarget() pour le détail complet.
#
# Variable d'environnement : TOP4EA_BASKET_TARGET
#   TOP4EA_BASKET_TARGET=0          → mode dynamique (défaut)
#   TOP4EA_BASKET_TARGET=25.00      → target fixe $25
basket_target    = 0
# basket_max_loss : seuil de perte d'urgence en état MaxRecoveryHold (valeur négative)
# Si le panier atteint ce seuil après épuisement de la Martingale,
# tout est fermé au marché pour limiter le drawdown. 0 = désactivé (attendre indéfiniment).
# Exemple : -300 = sortie forcée si le panier perd plus de $300 en mode hold.
# Variable d'environnement : TOP4EA_BASKET_MAX_LOSS
basket_max_loss  = -300.0
daily_target_pct = 100.0
use_vabt         = true
vabt_coeff       = 0.40

# ─── Recovery ────────────────────────────────────────────────
# Variable d'environnement : TOP4EA_MAX_RECOVERY
max_recovery     = 5
kelly_max        = 0.25

# ─── Plafonds de sécurité recovery ───────────────────────────
# max_recovery_active : nombre maximum de niveaux de recovery SIMULTANÉMENT actifs
#   Distinct de max_recovery (profondeur totale) : limite les niveaux actifs en même temps.
#   Ex: max_recovery=10, max_recovery_active=3 → au plus 3 niveaux actifs simultanément.
#   0 = désactivé (même comportement que max_recovery seul)
#   Variable d'environnement : TOP4EA_MAX_RECOVERY_ACTIVE
max_recovery_active = 0

# max_lots : plafond absolu de lots total du panier
#   Bloque tout nouveau stop si totalLots(ordres en cours) >= max_lots.
#   Sécurité anti-Martingale runaway, indépendante du lot par niveau.
#   Log : [GUARD] max_lots atteint — aucun nouveau recovery
#   0 = désactivé
#   Variable d'environnement : TOP4EA_MAX_LOTS
max_lots         = 0

# ─── Schedule de lots fixe (grille recovery XAUUSDc) ─────────
# true  → L1=0.01 L2=0.01(hedge) L3=0.02 L4=0.03 L5=0.04
# false → géométrique baseLot × lot_multiplier^n (Kelly-cappé)
use_fixed_lot_schedule = true

# ─── TP par vagues ───────────────────────────────────────────
# Fermeture progressive pour capturer le profit sans tout-ou-rien
#   Wave 1 : P&L ≥ wave1_target → ferme ~50% des positions
#   Wave 2 : P&L ≥ wave2_target → ferme ~30% du restant
#   Wave 3 : trailing 400 pips sur le reliquat (~20%)
wave_enabled     = true
wave1_target     = 5.00
wave2_target     = 10.00

# ─── Garde Cascade Professionnel ────────────────────────────
# [1] Déplacement de prix minimum depuis le dernier déclenchement
#
#     DEUX MODES (le mode pips est prioritaire si > 0) :
#
#     Mode pips fixe (RECOMMANDÉ) :
#       cascade_price_dispatch_pips = 120
#       → 120 pips = 1200 points (XAUUSDm digits=2 : 1 pip = 10 points)
#       → Indépendant du GridGap, cohérent et prévisible
#
#       ⚠ IMPORTANT : ce paramètre est le SPACING ENTRE RECOVERIES,
#       pas la distance trail (trail_fixed_dist_pts = 600 pts = 60 pips).
#       Ces deux valeurs DOIVENT être différentes :
#         trail_fixed_dist_pts  = 600 pts (60 pips) → séparation trail
#         cascade_dispatch_pips = 200 pips           → protection recovery
#
#       Plage recommandée pour XAUUSDm :
#         80  pips = 800  pts → marché calme
#         120 pips = 1200 pts → standard (défaut)
#         200 pips = 2000 pts → très conservateur
#
#     Mode % GridGap (fallback si pips = 0) :
#       cascade_price_dispatch_pct = 0.50
#       → 50% du GridGap (ex: 2400 × 0.50 = 1200 pts → trop large)
#
cascade_price_dispatch_pips = 200
cascade_price_dispatch_pct  = 0.50

# [2] Spread maximum autorisé (multiple du spread moyen EWMA)
#     Ex: 2.5 = bloqué si spread > 2.5× spread habituel (news/spike)
cascade_spread_max_mult    = 2.5

# [3] Anti-whipsaw : le prix doit tenir son côté après le déclenchement
#     (automatique — pas de paramètre à régler)

# Lissage EWMA pour le spread de référence (plus petit = plus lent = plus stable)
cascade_spread_ewma_alpha  = 0.05

# ─── Fermeture prédictive (vélocité P&L) ────────────────────
use_pnl_velocity = true
velocity_alpha   = 0.30
velocity_trigger = 0.85

# ─── Trail Stop Adaptatif — 4 axes ──────────────────────────
# [1] Step Trail : seuil minimum de déplacement avant de modifier un stop
#     Exprimé en % du GridGap courant
#     0.15 = le stop ne bouge que si le prix s'est déplacé de 1% du gap
#     Effet : -80% de OrderModify inutiles, stops plus stables
trail_step_pct          = 0.15

# [2] Gel zone TP : figer les stops quand le basket profit atteint ce % du target
#     0.60 = stops figés quand P&L ≥ 60% du target
#     Effet : protège les cycles gagnants en fin de parcours
trail_freeze_zone       = 0.60

# [3] Gap expansion par niveau de recovery
#     Chaque niveau de recovery élargit le gap de ce % supplémentaire
#     0.05 = au recovery 10 → gap × 1.50 (+50%), au recovery 5 → gap × 1.25
#     Effet : évite la cascade rapide sur les mêmes niveaux de prix
gap_expansion_factor    = 0.05

# [4] Trail asymétrique : facteur côté lourd vs côté léger
#     Le côté avec plus de recovery est éloigné (conservateur)
#     Le côté avec moins de recovery est rapproché (réactif)
#     0.15 = côté lourd gap×1.15, côté léger gap×0.85
trail_asymmetry_factor  = 0.15

# [5] Trail fixe en points (0 = désactivé → utilise le demi-GridGap adaptatif)
#     Quand > 0 : SS et BS placés à exactement cette distance du prix courant.
#
#     CALCUL PIPS → POINTS selon le symbole :
#     XAUUSDm 2 décimales (digits=2) : 1 pip = 10 points
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#     XAUUSDc 3 décimales (digits=3) : 1 pip = 10 points aussi
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#     Forex EURUSD 5 décimales       : 1 pip = 10 points
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#
#     IMPORTANT : Le broker impose un STOPLEVEL minimum (~100 pts pour XAU)
#     Si trail_fixed_dist_pts < minDist broker, c'est auto-ajusté au minimum.
#
#     0 = mode adaptatif (demi-GridGap × facteur intelligence)
#   100 = trail fixe 10 pips (valeur recommandée pour XAUUSDm)
trail_fixed_dist_pts    = 600

# [6] Seuil de déplacement minimum avant recalcul du trail (en points)
#     0         = quasi-continu (trail se recalcule à chaque tick, 1 pt mini)
#     25        = trail recalculé seulement si prix bouge de 25 pts (2.5 pips)
#     Recommandé avec trail_fixed_dist_pts > 0 : mettre à 0 ou 1
#     (en mode adaptatif, ce champ est ignoré et le seuil = demi-gap/10)
trail_min_change_pts    = 5

# ─── Trading ─────────────────────────────────────────────────
magic            = 10300
slippage         = 3
spread_avg_alpha = 0.10

# ─── Connexion MetaApi ───────────────────────────────────────
# Les credentials sont lus depuis les variables d'environnement :
#   METAAPI_TOKEN      : token d'authentification MetaApi
#   METAAPI_ACCOUNT_ID : identifiant du compte MT4 ou MT5 sur MetaApi
#   METAAPI_REGION     : région MetaApi (défaut : new-york)
#
# La plateforme (mt4/mt5) est détectée automatiquement depuis
# l'endpoint accountInformation si platform = auto (recommandé).
#
# Fréquences de polling
tick_poll_ms     = 500
state_poll_ms    = 2000
reconnect_ms     = 1000

# ─── Verrouillage Profit Trailing (V-BS / V-SS) ─────────────
# Ordres stops trailing qui verrouillent le profit progressivement
# au fur et à mesure que le prix avance dans le sens favorable.
#
# V-SS (Sell Stop Trailing, côté BUY) :
#   S'active quand bid > avgBuyEntry + vl_activation_pts
#   Niveau = bid - vl_trail_pts (trail en dessous du bid)
#   Ratchet UP strict : monte avec le bid, ne descend JAMAIS
#   Déclenchement (bid ≤ niveau) → toutes les Buy fermées = profit verrouillé
#
# V-BS (Buy Stop Trailing, côté SELL) :
#   S'active quand ask < avgSellEntry - vl_activation_pts
#   Niveau = ask + vl_trail_pts (trail au-dessus de l'ask)
#   Ratchet DOWN strict : descend avec l'ask, ne remonte JAMAIS
#   Déclenchement (ask ≥ niveau) → toutes les Sell fermées = profit verrouillé
#
# vl_activation_pts : profit minimum en points avant activation du trailing
#   XAUUSDm digits=2 : 50 pts = 5 pips = ~$0.50/lot de profit minimum
#   Recommandé : 30-100 pts selon volatilité et target
#
# vl_trail_pts : distance trailing en points
#   XAUUSDm digits=2 : 30 pts = 3 pips de trailing
#   Plus petit = verrouillage plus serré (risque de faux déclenchement)
#   Plus grand = plus de marge mais moins de profit verrouillé
#   Recommandé : 20-50 pts selon l'ATR et les préférences
vl_enabled          = true
# vl_activation_pts : CORRECTION BUG CRITIQUE
#   Ancienne valeur : 50 pts = $0.50 en prix → VL déclenchait sur du bruit ($0.05 de profit)
#   Nouvelle valeur : 2400 pts = 1 GridGap complet → le côté doit d'abord gagner ≥ 1 gap
#   Effet : VL ne s'active que quand le côté gagnant a réellement progressé d'un gap entier
#   Profit minimum avant activation (1.10 lots) : 2400 × 1.10 × 0.10 = $264 potentiel
vl_activation_pts   = 2400

# vl_trail_pts : CORRECTION BUG CRITIQUE
#   Ancienne valeur : 30 pts = $0.30 → tout spread widening déclenchait la fermeture
#   Nouvelle valeur : 600 pts = 25% du GridGap → trail significatif et robuste au bruit
#   À cette distance, un retournement de 600 pts ($6.00) est nécessaire pour fermer le côté
vl_trail_pts        = 600

# ─── Dual Trail NATURAL / AGGRESSIVE avec verrouillage profit ────
# Quand trail_mode_auto = true, le moteur surveille le profit flottant
# des positions Sell et bascule automatiquement en mode AGGRESSIVE
# quand le profit dépasse x_lock_pips.
#
# NATURAL  : trail fixe symétrique — distances natural_ss_dist_pts / natural_bs_dist_pts
#            Remplace trail_fixed_dist_pts pour permettre l'asymétrie SS ≠ BS
#
# AGGRESSIVE : le BuyStop glisse progressivement vers le niveau de verrou
#   Niveau verrou (V-BS) = ss_entry - bs_overshoot_pips pts (EN-DESSOUS de l'entrée)
#   Profit garanti au déclenchement BS = bs_overshoot_pips pts par lot
#   Glissement = aggressive_step_pts pts par tick (descendant depuis BS courant)
#   Une fois le verrou atteint : affiche [LOCK] et maintient le profit garanti
#
# Transition AGGRESSIVE→NATURAL : si le profit SS retombe sous x_lock_pips,
#   le verrou reste actif (sticky lock) et le BS se maintient à vLockPrice_.
#
# false = mode dual trail désactivé (comportement 100% identique à avant)
# true  = activation automatique selon profit SS flottant
trail_mode_auto         = true

# x_lock_pips : seuil de profit SS (en points) déclenchant le mode AGGRESSIVE
#   XAUUSDm digits=2, grid_gap=2400 pts :
#   CALIBRATION HISTORIQUE (data/automl_training.csv : 116 rows → 21 cycles groupés
#     avec seuil inter-cycle 600s ; tâche de référence mentionnait "76" pour une version
#     antérieure du CSV — source de vérité = fichier courant à 116 rows / 21 cycles)
#   Résultat backtest : P&L baseline=1852$, gain Dual Trail estimé=+407$ (+22%)
#   Paramètre retenu = 1 GridGap complet (2400 pts) = seuil tendance confirmée
#   → AGGRESSIVE déclenche quand le prix a parcouru 24.00$ en faveur des Sell
#   → Trop petit (ex: 500) risque de faux déclenchement sur spike intraday
x_lock_pips             = 2400

# bs_overshoot_pips : profit minimum garanti (en points) lors du déclenchement BS
#   V-BS lock level = ss_entry - bs_overshoot_pips * point (EN-DESSOUS de l'entrée)
#   CALIBRATION : 600 pts = 25% du GridGap (2400) = 6.00$ garanti par lot au déclenchement
#   Ex: ss_entry=1900.00, bs_overshoot_pips=600 → verrou @ 1900.00 - 6.00 = 1894.00
#   Quand BS déclenche à 1894 : profit Sell = 1900 - 1894 = 6.00 = 600 pts garanti
bs_overshoot_pips       = 600

# aggressive_step_pts : vitesse de glissement du BS par tick en mode AGGRESSIVE
#   CALIBRATION : 100 pts/tick (réduit de 200→100) pour éviter BS déclenché trop tôt
#   Avec gap BS→verrou ≈ 3000 pts : ~30 ticks (≈3 sec) pour atteindre le verrou
#   100 pts/tick = vitesse sécurisée sans risque de glissement trop rapide sur spike
aggressive_step_pts     = 100

# natural_bs_dist_pts : distance BS en mode NATURAL (quand trailModeAuto=true)
#   CALIBRATION : 1200 pts = 50% GridGap → asymétrie BS(1200) > SS(600)
#   BS plus éloigné en mode NATURAL = donne de la marge avant AGGRESSIVE
#   Garantit que le BS ne gêne pas pendant la phase d'accumulation Sell
natural_bs_dist_pts     = 1200

# natural_ss_dist_pts : distance SS en mode NATURAL (quand trailModeAuto=true)
#   CALIBRATION : 600 pts = 25% GridGap = cohérent avec trail_fixed_dist_pts
#   SS plus proche = détecte plus tôt le retournement Buy côté couverture
natural_ss_dist_pts     = 600

# ─── Dual Trail BUY (SS AGGRESSIVE miroir) ───────────────────
# Symétrie du mécanisme SELL-side AGGRESSIVE appliquée au côté BUY.
# Quand les positions BUY ont un profit flottant >= x_lock_pips_buy,
# la SellStop glisse progressivement VERS LE HAUT vers le niveau verrou :
#   Niveau verrou (V-SS BUY) = bs_avg_entry + ss_overshoot_pips pts (AU-DESSUS de l'entrée)
#   Profit garanti au déclenchement SS = ss_overshoot_pips pts par lot BUY
#   Glissement = aggressive_ss_step_pts pts par tick (montant depuis SS courant)
#   Une fois le verrou atteint : affiche [LOCK BUY] et maintient le profit garanti
#
# Transition AGGRESSIVE→NATURAL : si le profit BUY retombe sous x_lock_pips_buy,
#   le verrou reste actif (sticky lock) et la SS se maintient à ssLockPrice_.
#
# Exemple XAUUSDm digits=2 :
#   bs_avg_entry = 3000.00, ss_overshoot_pips = 500
#   → Verrou SS @ 3000.00 + 5.00 = 3005.00
#   → Quand SS déclenche à 3005 : profit BUY = 3005 - 3000 = 5.00 = 500 pts garanti

# x_lock_pips_buy : seuil de profit BUY (en points) déclenchant le mode SS AGGRESSIVE
#   XAUUSDm digits=2 : 500 pts = 50 pips = déplacement favorable de 50 pips
#   Recommandé : 1 GridGap complet (= grid_gap = 500 pts par défaut)
x_lock_pips_buy         = 500

# ss_overshoot_pips : profit minimum garanti (en points) lors du déclenchement SS (BUY)
#   V-SS lock level = bs_avg_entry + ss_overshoot_pips * point (AU-DESSUS de l'entrée BUY)
#   Ex: bs_entry=3000.00, ss_overshoot_pips=500 → verrou @ 3000.00 + 5.00 = 3005.00
#   Quand SS déclenche à 3005 : profit BUY = 3005 - 3000 = 5.00 = 500 pts garanti
ss_overshoot_pips       = 500

# aggressive_ss_step_pts : vitesse de glissement de la SS par tick en mode AGGRESSIVE BUY
#   La SS monte de ce nombre de points à chaque tick vers le niveau verrou
#   200 pts/tick = glissement progressif sur ~5-10 ticks typiquement
aggressive_ss_step_pts  = 200

# ─── ROLLBACK DUAL TRAIL ─────────────────────────────────────
# En cas de comportement anormal (BS AGGRESSIVE déclenché trop tôt) :
#   1. Mettre trail_mode_auto = false  → désactive IMMÉDIATEMENT le Dual Trail
#      (aucun redéploiement requis — lu au prochain restart du moteur)
#   2. Critère d'alerte : >2 transitions [DUAL TRAIL] NATURAL→AGGRESSIVE en <10 min
#      sans fermeture profitable correspondante dans les logs
#   3. Valeurs de repli (avant calibration) :
#      x_lock_pips=500 | bs_overshoot_pips=500 | aggressive_step_pts=200
#      natural_bs_dist_pts=600 | natural_ss_dist_pts=600
# Rapport de backtesting : data/dual_trail_backtest_report.txt
#   → 21 cycles groupés / baseline=1852$ / gain estimé Dual Trail: +407$ (+22%)

# ─── DeepSeek Anti-Biais Statique ───────────────────────────
# ds_stale_hard_sec : durée absolue (secondes) après laquelle un signal
# DeepSeek identique répété consécutivement est considéré périmé,
# indépendamment du TTL de 45s.
#
# Mécanisme : si le même signal (même direction + confidence ±5%) est
# reçu N fois de suite (configurable DS_REPEAT_DECAY_START=3), un decay
# progressif réduit la confidence effective jusqu'à 50% du brut.
# Après ds_stale_hard_sec secondes de répétition, fresh=false est forcé
# et le signal n'influence plus aucune décision BS/SS.
#
# Exemple : SELL_BIAS 65% répété depuis >5 min → affiché ⚠PÉRIMÉ [×8 ⚠STALE]
# 0 = désactivé (utilise uniquement le TTL de 45s)
# 300 = 5 minutes (défaut recommandé)
ds_stale_hard_sec   = 300

# deepseek_timeout_sec : timeout de démarrage DeepSeek (secondes).
# Si DeepSeek a une clé valide mais ne répond pas dans ce délai,
# le moteur bascule en mode local (décisions iniMTA uniquement).
# Le client reprend automatiquement dès qu'une réponse arrive.
# 0 = désactivé (attente infinie). Défaut : 120s.
deepseek_timeout_sec = 120

# ── Vote board gate — seuils directionnels ──────────────────────────────────
# vote_ss_only_threshold : score ≤ cette valeur → SS-only.
#   Défaut -2 (activation dès -2 sur [-5,+5]).
# vote_bs_only_threshold : score ≥ cette valeur → BS-only.
#   Défaut +2 (activation dès +2 sur [-5,+5]).
#   Écarter les seuils de zéro → gate plus strict, moins de blocages.
#   Les rapprocher de zéro → gate plus sensible, bloque plus tôt.
#
# ds_hard_gate_pct       : confiance DeepSeek (%) pour le DS hard-gate
#                          directionnel (prime sur le vote board).
#   Défaut 60. (ex: 70 = DeepSeek doit être très confiant)
#
# vote_gate_ds_conf_high : confiance DeepSeek (%) pour le poids ±2 dans le vote.
#   Défaut 40. Doit être < vote_gate_ds_conf_high.
vote_ss_only_threshold = -2
vote_bs_only_threshold = 2
ds_hard_gate_pct       = 60
vote_gate_ds_conf_high = 60
vote_gate_ds_conf_low  = 40
