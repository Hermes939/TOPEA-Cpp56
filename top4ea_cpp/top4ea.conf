# ============================================================
#  TOP4EA C++20 — Fichier de configuration
#  Compatible MetaTrader 4 ET MetaTrader 5 via MetaApi REST
# ============================================================

# ─── Plateforme MetaTrader ───────────────────────────────────
# auto : détecté automatiquement depuis l'info compte MetaApi
#          → recommandé, s'adapte selon le type de compte
# mt4  : forcer MT4 (slippage ticks, pas de fillingMode)
# mt5  : forcer MT5 (deviation points, fillingMode FOK, POSITION_MODIFY)
#
# DIFFÉRENCES MT4 / MT5 gérées automatiquement :
#   [1] Ordres marché : slippage (MT4) → deviation (MT5)
#   [2] Ordres marché : fillingMode = ORDER_FILLING_FOK ajouté pour MT5
#   [3] Modification SL/TP position : ORDER_MODIFY (MT4) → POSITION_MODIFY (MT5)
#   [4] Commentaire : tronqué à 31 caractères pour MT5
platform         = auto

# ─── Symbole & lots ─────────────────────────────────────────
symbol           = XAUUSDm
base_lot         = 0.10
lot_multiplier   = 1.15

# digits — Précision prix (décimales du broker)
#   0  = AUTO-DÉTECTION pure — le moteur interroge le broker au démarrage
#   2  = XAUUSDm 2 décimales — RECOMMANDÉ (safe fallback si broker offline)
#          point = 0.01  →  grid_gap 500 pts = $5.00  ← correct pour XAU
#          L'auto-détection broker viendra confirmer/remplacer si digits=broker
#   3  = Exness XAUUSDm 3 décimales → grid_gap 500 pts = $0.50
#   5  = EURUSD/paires forex — NE PAS utiliser pour XAU (gridGap = $0.005 !)
digits           = 2

# ─── Grille ─────────────────────────────────────────────────
grid_gap         = 500
use_atr_grid     = true
atr_period       = 14
atr_mult         = 0.5
atr_grid_min     = 200
atr_grid_max     = 1000

# ─── Targets ─────────────────────────────────────────────────
basket_target    = 7.0
daily_target_pct = 0.0

# ─── Recovery ────────────────────────────────────────────────
max_recovery     = 20
kelly_max        = 0.25

# ─── Garde Cascade Professionnel ────────────────────────────
# [1] Déplacement de prix minimum depuis le dernier déclenchement
#     Ex: 0.50 = le prix doit s'être écarté d'au moins 50% du GridGap
cascade_price_dispatch_pct = 0.50

# [2] Spread maximum autorisé (multiple du spread moyen EWMA)
#     Ex: 2.5 = bloqué si spread > 2.5× spread habituel (news/spike)
cascade_spread_max_mult    = 2.5

# [3] Anti-whipsaw : le prix doit tenir son côté après le déclenchement
#     (automatique — pas de paramètre à régler)

# Lissage EWMA pour le spread de référence (plus petit = plus lent = plus stable)
cascade_spread_ewma_alpha  = 0.05

# ─── Fermeture prédictive (vélocité P&L) ────────────────────
use_pnl_velocity = true
velocity_alpha   = 0.30
velocity_trigger = 0.85

# ─── Trail Stop Adaptatif — 4 axes ──────────────────────────
# [1] Step Trail : seuil minimum de déplacement avant de modifier un stop
#     Exprimé en % du GridGap courant
#     0.15 = le stop ne bouge que si le prix s'est déplacé de 15% du gap
#     Effet : -80% de OrderModify inutiles, stops plus stables
trail_step_pct          = 0.15

# [2] Gel zone TP : figer les stops quand le basket profit atteint ce % du target
#     0.60 = stops figés quand P&L ≥ 60% du target
#     Effet : protège les cycles gagnants en fin de parcours
trail_freeze_zone       = 0.60

# [3] Gap expansion par niveau de recovery
#     Chaque niveau de recovery élargit le gap de ce % supplémentaire
#     0.05 = au recovery 10 → gap × 1.50 (+50%), au recovery 5 → gap × 1.25
#     Effet : évite la cascade rapide sur les mêmes niveaux de prix
gap_expansion_factor    = 0.05

# [4] Trail asymétrique : facteur côté lourd vs côté léger
#     Le côté avec plus de recovery est éloigné (conservateur)
#     Le côté avec moins de recovery est rapproché (réactif)
#     0.15 = côté lourd gap×1.15, côté léger gap×0.85
trail_asymmetry_factor  = 0.15

# [5] Trail fixe en points (0 = désactivé → utilise le demi-GridGap adaptatif)
#     Quand > 0 : SS et BS placés à exactement cette distance du prix courant.
#
#     CALCUL PIPS → POINTS selon le symbole :
#     XAUUSDm 2 décimales (digits=2) : 1 pip = 10 points
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#     XAUUSDm 3 décimales (digits=3) : 1 pip = 10 points aussi
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#     Forex EURUSD 5 décimales       : 1 pip = 10 points
#       → 10 pips = 100 points  (trail_fixed_dist_pts = 100)
#
#     IMPORTANT : Le broker impose un STOPLEVEL minimum (~100 pts pour XAU)
#     Si trail_fixed_dist_pts < minDist broker, c'est auto-ajusté au minimum.
#
#     0 = mode adaptatif (demi-GridGap × facteur intelligence)
#   100 = trail fixe 10 pips (valeur recommandée pour XAUUSDm)
trail_fixed_dist_pts    = 0

# [6] Seuil de déplacement minimum avant recalcul du trail (en points)
#     0         = quasi-continu (trail se recalcule à chaque tick, 1 pt mini)
#     25        = trail recalculé seulement si prix bouge de 25 pts (2.5 pips)
#     Recommandé avec trail_fixed_dist_pts > 0 : mettre à 0 ou 1
#     (en mode adaptatif, ce champ est ignoré et le seuil = demi-gap/10)
trail_min_change_pts    = 0

# ─── Trading ─────────────────────────────────────────────────
magic            = 10300
slippage         = 3
spread_avg_alpha = 0.10

# ─── Connexion MetaApi ───────────────────────────────────────
# Les credentials sont lus depuis les variables d'environnement :
#   METAAPI_TOKEN      : token d'authentification MetaApi
#   METAAPI_ACCOUNT_ID : identifiant du compte MT4 ou MT5 sur MetaApi
#   METAAPI_REGION     : région MetaApi (défaut : new-york)
#
# La plateforme (mt4/mt5) est détectée automatiquement depuis
# l'endpoint accountInformation si platform = auto (recommandé).
#
# Fréquences de polling
tick_poll_ms     = 200
state_poll_ms    = 2000
reconnect_ms     = 1000
