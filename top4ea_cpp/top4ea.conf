# ============================================================
#  TOP4EA C++20 — Fichier de configuration
# ============================================================

# ─── Symbole & lots ─────────────────────────────────────────
symbol           = XAUUSDm
base_lot         = 0.10
lot_multiplier   = 1.15

# digits — Précision prix (décimales du broker)
#   0  = AUTO-DÉTECTION (recommandé) — le moteur interroge le broker
#          au démarrage et s'adapte automatiquement :
#          IC Markets / FXTM  → 2 décimales (XAUUSD)
#          Exness              → 3 décimales (XAUUSDm)
#          Forex 5-digit       → 5 décimales (EURUSD)
#   >0 = Surcharge manuelle — utile pour tests ou brokers exotiques
#          Les valeurs grille (grid_gap, atr_grid_min/max) sont alors
#          lues telles quelles sans rescale automatique.
digits           = 0

# ─── Grille ─────────────────────────────────────────────────
grid_gap         = 500
use_atr_grid     = true
atr_period       = 14
atr_mult         = 0.5
atr_grid_min     = 200
atr_grid_max     = 1000

# ─── Targets ─────────────────────────────────────────────────
basket_target    = 7.0
daily_target_pct = 0.0

# ─── Recovery ────────────────────────────────────────────────
max_recovery     = 20
kelly_max        = 0.25

# ─── Garde Cascade Professionnel ────────────────────────────
# [1] Déplacement de prix minimum depuis le dernier déclenchement
#     Ex: 0.50 = le prix doit s'être écarté d'au moins 50% du GridGap
cascade_price_dispatch_pct = 0.50

# [2] Spread maximum autorisé (multiple du spread moyen EWMA)
#     Ex: 2.5 = bloqué si spread > 2.5× spread habituel (news/spike)
cascade_spread_max_mult    = 2.5

# [3] Anti-whipsaw : le prix doit tenir son côté après le déclenchement
#     (automatique — pas de paramètre à régler)

# Lissage EWMA pour le spread de référence (plus petit = plus lent = plus stable)
cascade_spread_ewma_alpha  = 0.05

# ─── Fermeture prédictive (vélocité P&L) ────────────────────
use_pnl_velocity = true
velocity_alpha   = 0.30
velocity_trigger = 0.85

# ─── Trail Stop Adaptatif — 4 axes ──────────────────────────
# [1] Step Trail : seuil minimum de déplacement avant de modifier un stop
#     Exprimé en % du GridGap courant
#     0.15 = le stop ne bouge que si le prix s'est déplacé de 15% du gap
#     Effet : -80% de OrderModify inutiles, stops plus stables
trail_step_pct          = 0.15

# [2] Gel zone TP : figer les stops quand le basket profit atteint ce % du target
#     0.60 = stops figés quand P&L ≥ 60% du target
#     Effet : protège les cycles gagnants en fin de parcours
trail_freeze_zone       = 0.60

# [3] Gap expansion par niveau de recovery
#     Chaque niveau de recovery élargit le gap de ce % supplémentaire
#     0.05 = au recovery 10 → gap × 1.50 (+50%), au recovery 5 → gap × 1.25
#     Effet : évite la cascade rapide sur les mêmes niveaux de prix
gap_expansion_factor    = 0.05

# [4] Trail asymétrique : facteur côté lourd vs côté léger
#     Le côté avec plus de recovery est éloigné (conservateur)
#     Le côté avec moins de recovery est rapproché (réactif)
#     0.15 = côté lourd gap×1.15, côté léger gap×0.85
trail_asymmetry_factor  = 0.15

# ─── Trading ─────────────────────────────────────────────────
magic            = 10300
slippage         = 3
spread_avg_alpha = 0.10

# ─── Connexion MetaApi ───────────────────────────────────────
# Les credentials sont lus depuis les variables d'environnement :
#   METAAPI_TOKEN      : token d'authentification MetaApi
#   METAAPI_ACCOUNT_ID : identifiant du compte MT4 sur MetaApi
#   METAAPI_REGION     : région MetaApi (défaut : new-york)
#
# Fréquences de polling
tick_poll_ms     = 200
state_poll_ms    = 2000
reconnect_ms     = 1000
