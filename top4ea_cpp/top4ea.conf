# ============================================================
#  TOP4EA C++20 — Fichier de configuration
#  Équivalent des extern paramètres MQL4
# ============================================================

# ─── Symbole & lots ─────────────────────────────────────────
symbol           = XAUUSDm
base_lot         = 0.10
lot_multiplier   = 1.15
digits           = 5

# ─── Grille ─────────────────────────────────────────────────
grid_gap         = 500
use_atr_grid     = true
atr_period       = 14
atr_mult         = 0.5
atr_grid_min     = 200
atr_grid_max     = 1000

# ─── Targets ─────────────────────────────────────────────────
basket_target    = 7.0
daily_target_pct = 10.0

# ─── Recovery ────────────────────────────────────────────────
anti_cascade_sec = 3
max_recovery     = 20
kelly_max        = 0.25

# ─── Fermeture prédictive (vélocité P&L) ────────────────────
use_pnl_velocity = true
velocity_alpha   = 0.30
velocity_trigger = 0.85

# ─── Trading ─────────────────────────────────────────────────
magic            = 10300
slippage         = 3
spread_avg_alpha = 0.10

# ─── Connexion MT4 Bridge TCP ────────────────────────────────
bridge_host      = 127.0.0.1
bridge_port      = 9000
reconnect_ms     = 1000
ping_interval_ms = 2000
